name: Invoice checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  rules:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -r requirements.txt
      - name: Compile all code
        run: python -m compileall -q app scripts tests
      # Database and browser checks need MongoDB and a running app, which CI does not have.
      - name: Checks without database or browser
        run: python -m pytest -m "not db and not browser" -q -rs --junitxml=test-results/junit.xml
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: |
            test-report/index.html
            test-results/junit.xml
